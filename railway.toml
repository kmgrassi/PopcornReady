"$schema" = "https://railway.com/railway.schema.json"

# Railway deploys the Express API (apps/api) from the monorepo root.
# Set the Railway service Root Directory to the repo root so pnpm workspaces
# resolve; the commands below filter to the @popcorn/api workspace.
#
# Deploys are driven by Railway's native GitHub integration. The GitHub workflow
# in .github/workflows/deploy-api.yml builds the API and verifies that production
# eventually reports the pushed commit at /api/v1/health, but it does not invoke
# Railway CLI or require a Railway token.

[build]
builder = "RAILPACK"
buildCommand = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @popcorn/api... build"

[deploy]
startCommand = "pnpm --filter @popcorn/api start"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
drainingSeconds = 120
overlapSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
