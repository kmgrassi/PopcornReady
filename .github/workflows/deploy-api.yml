name: Verify API Deploy (Railway)

# Production deploy verification for the Express API (@popcorn/api on Railway).
#
# Railway's native GitHub integration deploys every push to main. This workflow
# does not deploy and does not need a Railway token; it builds the checked-out
# API as a visible gate, then polls production until /api/v1/health reports the
# pushed commit. That keeps "what's live == main HEAD" observable without a
# duplicated token-based deploy path.
#
# workflow_dispatch is allowed for manual verification, but the job is gated to
# refs/heads/main so a manual run against a stale branch cannot mark non-main
# code as the production target.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Serialize verification in push order. The Railway integration owns deployment;
# this job only waits for production to report the matching commit.
concurrency:
  group: railway-production-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only ever verify main. push already filters to main; this also blocks a
    # workflow_dispatch run targeting any other branch.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build gate: mirror railway.toml's buildCommand so a broken build fails
      # this verification workflow before we wait on Railway deployment.
      - name: Build @popcorn/api
        run: pnpm --filter @popcorn/api... build

      # Railway's native GitHub integration builds and deploys the pushed commit.
      # Poll the public health endpoint until it reports this exact commit so a
      # deploy that fails to boot/healthcheck fails this job instead of going
      # unnoticed.
      - name: Verify production is serving this commit
        run: |
          set -euo pipefail
          url="https://popcornready-production.up.railway.app/api/v1/health"
          echo "Waiting for $url to report commit $GITHUB_SHA"
          for attempt in $(seq 1 60); do
            live="$(curl -fsS --max-time 10 "$url" | jq -r '.commit // ""' || true)"
            # Match by prefix so a short or full SHA both satisfy the check.
            if [ -n "$live" ] && [ "${GITHUB_SHA#"$live"}" != "$GITHUB_SHA" ]; then
              echo "✓ Production is live on $live"
              exit 0
            fi
            echo "  attempt $attempt/60: live commit=${live:-<none>}; retrying in 10s"
            sleep 10
          done
          echo "::error::Production never reported commit $GITHUB_SHA — the deploy likely failed to boot or failed its healthcheck, so prod is still on the previous image."
          exit 1
