name: Apply Supabase migrations

# Applies pending supabase/migrations/** to the linked Supabase project.
# Runs on merge to main (when migrations change) and can be triggered manually
# from the main branch (workflow_dispatch) — e.g. to drain a backlog after a fix.
#
# Uses `db push --include-all` so out-of-order merges (an earlier timestamp
# landing after a later one) don't jam the queue and freeze the remote schema.
#
# Required GitHub repo config (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     SUPABASE_ACCESS_TOKEN  - personal access token (https://supabase.com/dashboard/account/tokens)
#     SUPABASE_DB_PASSWORD   - the project's database password (Project Settings -> Database)
#   The project ref below is NOT secret (it's in the project URL); change it to
#   target a different project.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/validate-supabase-migrations.mjs"
      - "scripts/validate-supabase-migrations.test.mjs"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  db-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # mll project ref (not secret).
      SUPABASE_PROJECT_REF: mllkugitfwasiwgbortk
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration versions
        run: |
          node --test scripts/validate-supabase-migrations.test.mjs
          node scripts/validate-supabase-migrations.mjs

      - uses: supabase/setup-cli@v1
        with:
          # Keep production mutations on a reviewed exact version. v2.112.0
          # regressed `link` by rejecting API-key timestamps returned by the
          # Management API: https://github.com/supabase/cli/issues/6115
          version: 2.111.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push pending migrations
        # --include-all applies every pending migration even when an earlier
        # timestamp lands after a later one on remote (inevitable with parallel
        # branches merging out of order). Without it, one out-of-order file makes
        # `db push` exit 1 and JAMS THE WHOLE QUEUE — prod schema silently freezes
        # while the API keeps deploying (PGRST202 / missing-column 500s). Safe here
        # because migrations are additive by rule (no edits to applied files), so
        # apply order is independent; a genuinely broken migration still fails loudly.
        run: supabase db push --include-all
