name: Web E2E

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".agent/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".agent/**"

concurrency:
  group: web-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @popcorn/web exec playwright install --with-deps chromium webkit

      - name: Run web e2e smoke
        run: pnpm --filter @popcorn/web test:e2e

      - name: Run PWA regression e2e
        run: pnpm --filter @popcorn/web test:e2e:pwa

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
