# Netlify deploys the Vite React SPA (apps/web) from the monorepo root.
# The build runs at the repo root so pnpm workspaces resolve, then publishes
# the app's static output.
#
# Build-time env (set in Netlify, not here — they are inlined by Vite at build,
# so changing them requires a redeploy):
#   VITE_API_URL          -> optional Railway API origin override for the SPA client
#   VITE_SUPABASE_URL     -> hosted Supabase project URL
#   VITE_SUPABASE_ANON_KEY-> hosted Supabase anon key
# If VITE_API_URL is empty the client falls back to same-origin /api/*, which is
# proxied below before the SPA fallback can serve index.html.

[build]
  # Netlify auto-detects pnpm from pnpm-lock.yaml + the root packageManager
  # field and runs `pnpm install` before this command, so the command only
  # needs to build the web workspace (and its workspace deps via `...`).
  command = "pnpm --filter @popcorn/web... build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-store"
    Content-Type = "application/json; charset=utf-8"

# Same-origin API proxy for deployed SPA clients that use the default /api base.
[[redirects]]
  from = "/api/*"
  to = "https://popcornready-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback: every non-asset route resolves to index.html so client-side
# routing (react-router) handles deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
